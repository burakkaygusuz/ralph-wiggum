name: CI Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Manifest & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning

      - name: Validate plugin.json
        run: |
          jq -e '
            ."$schema" == "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json" and
            .name == "ralph-wiggum" and
            .version != null and
            .extensions["com.anthropic.claude-code"] != null and
            .extensions["com.anysphere.cursor"] != null and
            (.skills == null)
          ' plugin.json >/dev/null
          echo "plugin.json conforms to the Agent Plugins 1.0.0 fields checked above"

      - name: Validate all manifests
        run: |
          for f in plugin.json .claude-plugin/plugin.json .codex-plugin/plugin.json .antigravity-plugin/plugin.json; do
            jq -e '.name == "ralph-wiggum" and (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$f" >/dev/null || { echo "::error file=$f::bad name or version"; exit 1; }
          done
          [ "$(jq -r .version plugin.json .claude-plugin/plugin.json .codex-plugin/plugin.json .antigravity-plugin/plugin.json | sort -u | wc -l)" -eq 1 ] || { echo "::error::manifest versions differ"; exit 1; }
          for f in .claude-plugin/marketplace.json .agents/plugins/marketplace.json; do
            jq -e '.name == "ralph-wiggum" and .plugins[0].name == "ralph-wiggum" and .plugins[0].source == "./"' "$f" >/dev/null || { echo "::error file=$f::bad marketplace entry"; exit 1; }
          done
          jq -e '.owner.name != null' .claude-plugin/marketplace.json >/dev/null || { echo "::error::marketplace.json needs owner.name"; exit 1; }
          jq -e '.hooks == "./hooks/hooks.json" and .commands == "./commands"' .claude-plugin/plugin.json >/dev/null || { echo "::error::bad .claude-plugin hooks/commands"; exit 1; }
          jq -e '.hooks == "./hooks/hooks.json"' .codex-plugin/plugin.json >/dev/null || { echo "::error::bad .codex-plugin hooks"; exit 1; }
          jq -e '.["ralph-wiggum"].Stop[0].command | startswith("bash ./scripts/stop-hook.sh antigravity")' hooks.json >/dev/null || { echo "::error::bad Antigravity hooks.json"; exit 1; }
          test -f hooks/hooks.json -a -d commands
          echo "all manifests valid"

  test:
    name: Run Test Suite (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Test Suite
        run: ./tests/run-tests.sh

  release:
    name: Semantic Release
    needs: [validate, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          branch: main
          fallbackTag: v1.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: silent

      - name: Update Plugin Manifest Versions
        if: steps.semver.outputs.nextStrict != '' && steps.semver.outputs.bump != 'none'
        env:
          NEXT_VERSION: ${{ steps.semver.outputs.nextStrict }}
        run: |
          python3 -c "
          import os, json, pathlib, sys
          for name in sys.argv[1:]:
              p = pathlib.Path(name)
              data = json.loads(p.read_text(encoding='utf-8'))
              data['version'] = os.environ['NEXT_VERSION']
              p.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          " plugin.json .claude-plugin/plugin.json .codex-plugin/plugin.json .antigravity-plugin/plugin.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin.json .claude-plugin/plugin.json .codex-plugin/plugin.json .antigravity-plugin/plugin.json
          git diff-index --quiet HEAD || git commit -m "chore(release): bump version to $NEXT_VERSION [skip ci]"
          git push origin main

      - name: Publish GitHub Release & Tag
        if: steps.semver.outputs.next != '' && steps.semver.outputs.bump != 'none'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.semver.outputs.next }}
          name: ${{ steps.semver.outputs.next }}
          generate_release_notes: true
          make_latest: true
          token: ${{ github.token }}
