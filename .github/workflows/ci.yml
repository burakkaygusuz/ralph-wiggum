name: CI Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Manifest & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning

      - name: Validate plugin.json
        run: |
          jq -e '
            has("$schema") == false and
            .name == "ralph-wiggum" and
            .version != null and
            .extensions["com.anthropic.claude-code"] != null and
            .extensions["com.anysphere.cursor"] != null and
            (.skills == null)
          ' plugin.json >/dev/null
          echo 'plugin.json checks passed (no $schema: Codex loads no plugin hooks when it is declared)'

      - name: Validate all manifests
        run: |
          for f in plugin.json .claude-plugin/plugin.json .codex-plugin/plugin.json .antigravity-plugin/plugin.json .cursor-plugin/plugin.json; do
            jq -e '.name == "ralph-wiggum" and (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$f" >/dev/null || { echo "::error file=$f::bad name or version"; exit 1; }
          done
          [ "$(jq -r .version plugin.json .claude-plugin/plugin.json .codex-plugin/plugin.json .antigravity-plugin/plugin.json .cursor-plugin/plugin.json | sort -u | wc -l)" -eq 1 ] || { echo "::error::manifest versions differ"; exit 1; }
          for f in .claude-plugin/marketplace.json .agents/plugins/marketplace.json; do
            jq -e '.name == "ralph-wiggum" and .plugins[0].name == "ralph-wiggum" and .plugins[0].source == "./"' "$f" >/dev/null || { echo "::error file=$f::bad marketplace entry"; exit 1; }
          done
          jq -e '.owner.name != null' .claude-plugin/marketplace.json >/dev/null || { echo "::error::marketplace.json needs owner.name"; exit 1; }
          jq -e '.hooks == "./hooks/hooks.json" and .commands == "./commands"' .claude-plugin/plugin.json >/dev/null || { echo "::error::bad .claude-plugin hooks/commands"; exit 1; }
          jq -e '.hooks == "./hooks/hooks.json"' .codex-plugin/plugin.json >/dev/null || { echo "::error::bad .codex-plugin hooks"; exit 1; }
          jq -e '.hooks == "./hooks/cursor-hooks.json"' .cursor-plugin/plugin.json >/dev/null || { echo "::error::bad .cursor-plugin hooks"; exit 1; }
          jq -e '.["ralph-wiggum"].Stop[0].command | startswith("bash ./scripts/stop-hook.sh antigravity")' hooks.json >/dev/null || { echo "::error::bad Antigravity hooks.json"; exit 1; }
          jq -e '.version == 1 and (.hooks.Stop[0].bash | contains("stop-hook.sh"))' com.github.copilot/hooks/hooks.json >/dev/null || { echo "::error::bad Copilot hooks"; exit 1; }
          test -f hooks/hooks.json -a -d commands
          echo "all manifests valid"

  test:
    name: Run Test Suite (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Test Suite
        run: ./tests/run-tests.sh

  release:
    name: Semantic Release
    needs: [validate, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Calculate Next Version
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          branch: main
          fallbackTag: v1.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: silent

      - name: Update Plugin Manifest Versions
        if: steps.semver.outputs.nextStrict != '' && steps.semver.outputs.bump != 'none'
        env:
          NEXT_VERSION: ${{ steps.semver.outputs.nextStrict }}
        run: |
          for f in plugin.json .claude-plugin/plugin.json .codex-plugin/plugin.json .antigravity-plugin/plugin.json .cursor-plugin/plugin.json; do
            jq --arg v "$NEXT_VERSION" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump version to $NEXT_VERSION [skip ci]" || exit 0
          git push origin main

      - name: Publish GitHub Release & Tag
        if: steps.semver.outputs.next != '' && steps.semver.outputs.bump != 'none'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.semver.outputs.next }}
          name: ${{ steps.semver.outputs.next }}
          generate_release_notes: true
          make_latest: true
          token: ${{ github.token }}
