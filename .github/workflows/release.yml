name: Automated Release & Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          fallbackTag: v1.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: silent

      - name: Update plugin.json Version
        if: steps.semver.outputs.nextStrict != '' && steps.semver.outputs.bump != 'none'
        env:
          NEXT_VERSION: ${{ steps.semver.outputs.nextStrict }}
        run: |
          python3 -c "
          import os, json, pathlib
          p = pathlib.Path('plugin.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['version'] = os.environ['NEXT_VERSION']
          p.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin.json
          git diff-index --quiet HEAD || git commit -m "chore(release): bump version to ${{ steps.semver.outputs.nextStrict }} [skip ci]"
          git push origin main

      - name: Publish GitHub Release & Tag
        if: steps.semver.outputs.next != '' && steps.semver.outputs.bump != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.next }}
          name: Release ${{ steps.semver.outputs.next }}
          generate_release_notes: true
          make_latest: true
          token: ${{ github.token }}
